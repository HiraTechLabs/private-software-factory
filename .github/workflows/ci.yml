name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Architecture graph
        run: python scripts/graph_check.py --check
      - name: UI lint
        run: python scripts/ui_lint.py
      - name: Tokens build
        run: python scripts/build_tokens.py --check
