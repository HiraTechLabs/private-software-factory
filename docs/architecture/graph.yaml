# Proposed architecture graph for the Private Software Factory (target state).
# Compatible with scripts/graph_check.py: existing node ids are kept, new work is `planned`.
# New optional fields: `evidence` (test ids proving an implemented node works), `group` (draws the diagram) and `target_path` (where a planned node will live;
# rename it to `path` and flip `status` to implemented in the commit that builds the node).
schema_version: 1
project: factory
nodes:
  # ---------- Interface: what the owner sees ----------
  - id: web-app
    kind: service
    name: Factory web app
    purpose: Every page the owner uses - Today, Projects, Requests, Models, Guide.
    path: src/factory/main.py
    owns: []
    status: implemented
    evidence: ["tests/test_app.py::test_create_project_valid", "tests/test_app.py::test_duplicate_error_visible", "tests/test_app.py::test_stats_are_computed", "tests/test_app.py::test_health"]
    group: interface
  - id: ui-system
    kind: doc
    name: UI system
    purpose: Tokens, a small set of plain-named components, and the closed status vocabulary.
    path: design
    owns: ["design tokens", "component catalog", "status vocabulary"]
    status: implemented
    evidence: ["tests/test_ui_catalog.py", "tests/test_tokens_contrast.py"]
    group: interface
  - id: guide
    kind: doc
    name: In-app guide
    purpose: One plain-language page that explains the flow, shown at /guide.
    target_path: docs/GUIDE.md
    owns: ["owner-facing explanation"]
    status: planned
    group: interface
  - id: records-view
    kind: module
    name: Records view
    purpose: Reads a project's decisions and architecture graph and prepares them for the Decisions and Graph pages.
    target_path: src/factory/records_view.py
    owns: []
    status: planned
    group: interface
  - id: demo-project
    kind: module
    name: Demo project
    purpose: Creates a tiny sample project that runs on the scripted demo model, so the whole flow can be tried in a minute.
    target_path: src/factory/demo.py
    owns: []
    status: planned
    group: interface

  # ---------- Engine: runs the one fixed flow ----------
  - id: orchestrator
    kind: service
    name: Orchestrator
    purpose: Runs one change through the fixed flow in the background and stops at every human approval.
    target_path: src/factory/orchestrator.py
    owns: []
    status: planned
    group: engine
  - id: flow
    kind: module
    name: Flow definition
    purpose: The fixed steps, the allowed state transitions, and who may trigger each one (machine, model, or human).
    target_path: src/factory/flow.py
    owns: ["the fixed flow", "change states"]
    status: planned
    group: engine
  - id: context-builder
    kind: module
    name: Context builder
    purpose: Builds what each model role is told - the request, principles, decisions, graph, and file tree.
    target_path: src/factory/context_builder.py
    owns: []
    status: planned
    group: engine
  - id: model-gateway
    kind: service
    name: Model gateway
    purpose: One interface for the planning, execution, and review roles. Providers - manual (you paste), local Ollama, scripted demo.
    target_path: src/factory/models
    owns: ["provider configuration"]
    status: planned
    group: engine
  - id: patch-applier
    kind: module
    name: Patch applier
    purpose: Turns the execution role's file blocks into a commit on the change branch, after validating every path and size.
    target_path: src/factory/patch_applier.py
    owns: []
    status: planned
    group: engine
  - id: check-runner
    kind: module
    name: Project check runner
    purpose: Runs only the commands the project manifest declares, with a timeout, and keeps the log.
    target_path: src/factory/check_runner.py
    owns: []
    status: planned
    group: engine
  - id: approvals
    kind: module
    name: Approvals
    purpose: The only place a merge or a production release can be approved, and only from a human click in the web app.
    target_path: src/factory/approvals.py
    owns: ["approval decisions"]
    status: planned
    group: engine
  - id: deployer
    kind: module
    name: Deployer
    purpose: Runs the project's dev or production deploy command after the matching approval.
    target_path: src/factory/deployer.py
    owns: []
    status: planned
    group: engine
  - id: git-ops
    kind: module
    name: Git operations
    purpose: Thin wrapper over the git command - init, worktree, commit, diff, merge.
    target_path: src/factory/git_ops.py
    owns: []
    status: planned
    group: engine

  # ---------- State and records: files, not a database ----------
  - id: manifest
    kind: module
    name: Manifest model
    purpose: Pydantic v2 model for project.yaml, including checks, deploy commands, limits, and approval policy.
    path: src/factory/manifest.py
    owns: []
    status: implemented
    evidence: ["tests/test_app.py::test_approval_flag_false_without_waiver_is_invalid", "tests/test_app.py::test_manifest_id_pattern_rejects_traversal"]
    group: state
  - id: registry
    kind: store
    name: Project registry
    purpose: Registered projects as data/projects/<id>/project.yaml (git-ignored).
    path: data/projects
    owns: ["project registrations"]
    status: implemented
    evidence: ["tests/test_app.py::test_create_project_valid", "tests/test_app.py::test_invalid_yaml_shows_error_state"]
    group: state
  - id: change-store
    kind: store
    name: Change store
    purpose: One folder per request - change.yaml plus plan, prompts, model answers, diff, check logs, review.
    target_path: data/projects/*/changes
    owns: ["requests", "change states", "step artifacts"]
    status: planned
    group: state
  - id: audit-log
    kind: store
    name: Audit log
    purpose: Append-only list of who or what moved each change, and when.
    target_path: data/projects/*/audit.jsonl
    owns: ["audit events"]
    status: planned
    group: state
  - id: shared-principles
    kind: doc
    name: Shared principles
    purpose: Rules every project follows - security, clean code, design patterns.
    target_path: data/shared/principles
    owns: ["shared rules"]
    status: planned
    group: state
  - id: project-principles
    kind: doc
    name: Project principles
    purpose: Per-project rules - security, business, architecture, stack, clean code, performance.
    target_path: data/projects/*/principles
    owns: ["project rules"]
    status: planned
    group: state
  - id: decisions-log
    kind: doc
    name: Decisions log
    purpose: ADRs recording every decision and every exception to a rule.
    path: docs/decisions
    owns: []
    status: implemented
    group: state
  - id: graph
    kind: doc
    name: Architecture graph
    purpose: Node and edge map of the Factory, checked and rendered from graph.yaml.
    path: docs/architecture
    owns: []
    status: implemented
    group: state

  # ---------- Projects: what the Factory builds ----------
  - id: project-repo
    kind: store
    name: Project repository
    purpose: One git repository per project, never shared. The Factory itself is registered as project 0. Models can only write on a change branch.
    target_path: data/projects/*/repo
    owns: ["project codebase"]
    status: planned
    group: projects
  - id: git-server
    kind: external
    name: Git
    purpose: The git command today; a remote host such as GitHub later.
    status: planned
    group: projects
  - id: local-model-server
    kind: external
    name: Local model server
    purpose: Ollama or another local server. Slow hardware is fine; the Factory waits.
    status: planned
    group: projects

  # ---------- Quality: how we know it works ----------
  - id: checks
    kind: service
    name: Factory self-checks
    purpose: Local scripts that guard this repository - records, imports, the UI system, no dead controls. Not the per-project Checks step.
    path: scripts
    owns: []
    status: implemented
    group: quality
  - id: ci
    kind: service
    name: CI
    purpose: Runs the same single check command on every push, so a broken push is visible on GitHub.
    path: .github/workflows/ci.yml
    owns: []
    status: implemented
    group: quality
  - id: feature-register
    kind: doc
    name: Feature register
    purpose: Every feature the owner can see, marked working only when a named test proves it.
    target_path: docs/FEATURES.md
    owns: ["feature truth table"]
    status: planned
    group: quality
  - id: e2e-smoke
    kind: module
    name: End-to-end smoke test
    purpose: Walks a demo request from intake to live through the real web app and prints pass or fail per step.
    target_path: scripts/smoke.py
    owns: []
    status: planned
    group: quality

edges:
  # ----- exists today -----
  - {from: web-app, to: manifest, kind: depends_on, note: "main.py loads and validates project.yaml through the manifest model.", status: implemented, decisions: ["0002", "0004"]}
  - {from: web-app, to: registry, kind: reads, note: "Lists projects from data/projects.", status: implemented, decisions: ["0004"]}
  - {from: web-app, to: registry, kind: writes, note: "Registration creates the directory and writes project.yaml atomically.", status: implemented, decisions: ["0004"]}
  - {from: web-app, to: ui-system, kind: depends_on, note: "All pages use tokens, components, and the status vocabulary only.", status: implemented, decisions: ["0005"]}
  - {from: checks, to: graph, kind: enforces, note: "graph_check.py validates graph.yaml and ADR references.", status: implemented, decisions: ["0008"]}
  - {from: checks, to: ui-system, kind: enforces, note: "ui_lint.py and build_tokens.py enforce the UI system.", status: implemented, decisions: ["0005"]}
  - {from: checks, to: decisions-log, kind: enforces, note: "ADR ids referenced by the graph or by waivers must exist.", status: implemented, decisions: ["0008"]}
  - {from: ci, to: checks, kind: calls, note: "CI runs every check in a fresh environment.", status: implemented, decisions: ["0003"]}

  # ----- quality: proof that things work -----
  - {from: checks, to: feature-register, kind: enforces, note: "features_check.py fails when a feature marked working has no test", status: planned, decisions: []}
  - {from: ci, to: e2e-smoke, kind: calls, note: "CI runs the smoke test after the unit tests.", status: planned, decisions: []}
  - {from: e2e-smoke, to: web-app, kind: calls, note: "Drives the real pages and forms with the scripted demo model.", status: planned, decisions: []}

  # ----- interface -----
  - {from: web-app, to: orchestrator, kind: calls, note: "Creating or retrying a request starts a run.", status: planned, decisions: []}
  - {from: web-app, to: approvals, kind: calls, note: "The Approve and Send back buttons post here.", status: planned, decisions: ["0002"]}
  - {from: web-app, to: change-store, kind: reads, note: "Today and Request pages are built from the change folders.", status: planned, decisions: []}
  - {from: web-app, to: audit-log, kind: reads, note: "Activity list on every Request page.", status: planned, decisions: []}
  - {from: web-app, to: model-gateway, kind: calls, note: "Test connection button on the Models page.", status: planned, decisions: []}
  - {from: web-app, to: records-view, kind: depends_on, note: "Decisions and Graph tabs.", status: planned, decisions: []}
  - {from: web-app, to: guide, kind: reads, note: "Renders /guide from docs/GUIDE.md.", status: planned, decisions: []}
  - {from: web-app, to: demo-project, kind: calls, note: "Create demo project button on Today.", status: planned, decisions: []}
  - {from: demo-project, to: registry, kind: writes, note: "Registers the demo project.", status: planned, decisions: []}
  - {from: demo-project, to: git-ops, kind: depends_on, note: "Creates the demo repository.", status: planned, decisions: []}
  - {from: records-view, to: project-repo, kind: reads, note: "Reads docs/decisions and docs/architecture/graph.yaml of the project.", status: planned, decisions: []}

  # ----- engine -----
  - {from: orchestrator, to: flow, kind: depends_on, note: "Only moves a change along transitions the flow allows.", status: planned, decisions: ["0002"]}
  - {from: orchestrator, to: manifest, kind: reads, note: "Checks, deploy commands, limits, and roles come from the manifest.", status: planned, decisions: ["0002"]}
  - {from: orchestrator, to: change-store, kind: writes, note: "Saves state and every artifact of each step.", status: planned, decisions: []}
  - {from: orchestrator, to: audit-log, kind: writes, note: "One event per transition.", status: planned, decisions: []}
  - {from: orchestrator, to: context-builder, kind: calls, note: "Asks for the context of each role.", status: planned, decisions: []}
  - {from: orchestrator, to: model-gateway, kind: calls, note: "Planning, execution, and review roles.", status: planned, decisions: []}
  - {from: orchestrator, to: patch-applier, kind: calls, note: "Build step.", status: planned, decisions: []}
  - {from: orchestrator, to: check-runner, kind: calls, note: "Checks step.", status: planned, decisions: []}
  - {from: orchestrator, to: deployer, kind: calls, note: "Deploy steps, only after approval.", status: planned, decisions: []}
  - {from: orchestrator, to: git-ops, kind: depends_on, note: "Merge after approval.", status: planned, decisions: []}
  - {from: approvals, to: flow, kind: depends_on, note: "Approval is accepted only in an awaiting state.", status: planned, decisions: ["0002"]}
  - {from: approvals, to: change-store, kind: writes, note: "Records the decision on the change.", status: planned, decisions: []}
  - {from: approvals, to: audit-log, kind: writes, note: "Records who approved what, and when.", status: planned, decisions: []}
  - {from: approvals, to: orchestrator, kind: calls, note: "Resumes the run after approval.", status: planned, decisions: []}
  - {from: context-builder, to: shared-principles, kind: reads, note: "Included in every role's context.", status: planned, decisions: []}
  - {from: context-builder, to: project-principles, kind: reads, note: "Included in every role's context.", status: planned, decisions: []}
  - {from: context-builder, to: decisions-log, kind: reads, note: "Index of the project's decisions.", status: planned, decisions: ["0008"]}
  - {from: context-builder, to: project-repo, kind: reads, note: "File tree and the relevant files.", status: planned, decisions: []}
  - {from: model-gateway, to: local-model-server, kind: calls, note: "Ollama provider.", status: planned, decisions: []}
  - {from: patch-applier, to: manifest, kind: reads, note: "Protected paths and size limits.", status: planned, decisions: []}
  - {from: patch-applier, to: git-ops, kind: depends_on, note: "Branch and commit.", status: planned, decisions: []}
  - {from: patch-applier, to: project-repo, kind: writes, note: "Writes only on the change branch worktree.", status: planned, decisions: []}
  - {from: check-runner, to: manifest, kind: reads, note: "The only source of runnable commands.", status: planned, decisions: []}
  - {from: check-runner, to: project-repo, kind: reads, note: "Runs inside the change worktree.", status: planned, decisions: []}
  - {from: deployer, to: manifest, kind: reads, note: "Dev and production commands.", status: planned, decisions: []}
  - {from: git-ops, to: git-server, kind: calls, note: "Runs git.", status: planned, decisions: []}
  - {from: project-repo, to: git-server, kind: depends_on, note: "Stored as a git repository.", status: planned, decisions: []}
