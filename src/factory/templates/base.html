<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Software Factory{% endblock %}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="brand">Software Factory</div>
    <nav>
      {% for item in rail_items %}
      <a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}{% if item.badge %}<span class="badge">{{ item.badge }}</span>{% endif %}</a>
      {% endfor %}
    </nav>
    <div class="rail-bottom">Local instance</div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
