{% macro line_rail(steps) -%}
<ol class="line-rail" data-component="line-rail">
  {% for step in steps %}
  <li class="line-rail__step line-rail__step--{{ step.light }}{% if loop.first %} line-rail__step--ink{% endif %}" data-light="{{ step.light }}" data-mode="{{ step.mode }}">
    <span class="line-rail__dot" aria-hidden="true"></span>
    <span class="line-rail__label">{{ step.label }}</span>
  </li>
  {% endfor %}
</ol>
{%- endmacro %}
