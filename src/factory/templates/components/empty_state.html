{% macro empty_state(title, body, action_href=None, action_label=None) -%}
<div class="empty-state" data-component="empty-state">
  <h3>{{ title }}</h3>
  <p class="muted">{{ body }}</p>
  {% if action_href and action_label %}
    {% from "components/button.html" import button %}
    {{ button(action_label, href=action_href) }}
  {% endif %}
</div>
{%- endmacro %}
