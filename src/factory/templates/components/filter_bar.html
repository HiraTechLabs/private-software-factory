{% macro filter_bar(fields, action="/") -%}
<form class="filter-bar" data-component="filter-bar" method="get" action="{{ action }}">
  {% for field in fields %}
  <label class="filter-bar__item">
    <span class="filter-bar__label">{{ field.label }}</span>
    <input class="filter-bar__input" type="text" name="{{ field.name }}"
      value="{{ field.value or "" }}" placeholder="{{ field.placeholder or "" }}">
  </label>
  {% endfor %}
</form>
{%- endmacro %}
