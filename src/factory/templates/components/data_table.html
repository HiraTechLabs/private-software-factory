{% macro data_table(columns, rows) -%}
<div class="data-table" data-component="data-table">
  <table>
    <caption>Rows: {{ rows | length }}</caption>
    <thead>
      <tr>
        {% for column in columns %}<th scope="col">{{ column }}</th>{% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for cell in row %}<td>{{ cell }}</td>{% endfor %}
      </tr>
      {% else %}
      <tr><td colspan="{{ columns | length }}" class="muted">No rows to show.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{%- endmacro %}
