[project]
name = "private-software-factory"
version = "0.1.0"
description = "Private Software Factory: one fixed flow for every change, human-approved."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "jinja2",
    "pyyaml",
    "uvicorn",
    "python-multipart",
    "pydantic>=2",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["factory"]
